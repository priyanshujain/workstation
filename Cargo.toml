[workspace]
resolver = "2"

members = [
    "crates/wsctl-core",
    "crates/packages",
    "crates/disk",
    "crates/display",
    "crates/apps",
    "crates/audio",
    "crates/audio-ui",
]

[workspace.package]
version = "0.1.2"
edition = "2024"
authors = ["pj <ipriyanshujain@gmail.com>"]
license = "GPL-3.0-or-later"

[workspace.dependencies]
# Core
anyhow = "1.0"
thiserror = "2.0"
petgraph = "0.8"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
dirs = "6.0"
time = { version = "0.3", default-features = false, features = ["formatting", "macros"] }

# CLI
clap = { version = "4.6", features = ["derive"] }
console = "0.16"
indicatif = "0.18"

# TUI
ratatui = "0.30"
crossterm = "0.29"

# Internal crates
wsctl-core = { path = "crates/wsctl-core" }
packages = { path = "crates/packages" }
disk = { path = "crates/disk" }
display = { path = "crates/display" }
apps = { path = "crates/apps" }
audio = { path = "crates/audio" }

[package]
name = "wsctl"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Workstation controller, manage macOS setup declaratively"

[[bin]]
name = "wsctl"
path = "src/main.rs"

[dependencies]
wsctl-core.workspace = true
apps.workspace = true
audio.workspace = true
packages.workspace = true
disk.workspace = true
display.workspace = true
anyhow.workspace = true
clap.workspace = true
console.workspace = true
indicatif.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
ratatui.workspace = true
crossterm.workspace = true
dirs.workspace = true
time.workspace = true
