[package]
name = "share-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Stream one Rex tab to the share relay"

[dependencies]
anyhow.workspace = true
base64 = "0.23.1"
getrandom = "0.3"
dirs.workspace = true
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
libc = "0.2.191"
percent-encoding = "2.3.2"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde_json.workspace = true
share-protocol.workspace = true
tokio = { version = "1.54.1", features = ["rt", "macros", "net", "time", "signal", "sync"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
