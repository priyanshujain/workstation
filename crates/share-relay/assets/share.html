<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shared terminal</title>

</head>
<body>
<header>

  <span id="mode" class="pill"></span>

<main><div id="terminal"></div></main>

</html>
