<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shared terminals</title>
<link rel="stylesheet" href="/assets/xterm.css">
<link rel="stylesheet" href="/assets/share.css">
</head>
<body class="app">
<aside id="sidebar">
  <div id="heading">Shared with you</div>
  <nav id="tabs"></nav>
  <form id="logout" method="post" action="/logout"><button type="submit">Log out</button></form>
</aside>
<section id="view">
  <header id="bar" hidden>
    <span id="label"></span>
    <span id="mode" class="pill"></span>
    <span id="status" class="pill" hidden></span>
    <span id="viewers"></span>
    <span id="expiry"></span>
  </header>
  <main id="screen" hidden><div id="terminal"></div></main>
  <div id="notice">Connecting</div>
  <div id="ended" hidden></div>
  <div id="toast" hidden></div>
</section>
<script src="/assets/xterm.js"></script>
<script src="/assets/share.js"></script>
</body>
</html>
