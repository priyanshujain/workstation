[package]
name = "share-relay"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Public front door for shared Rex tabs"

[dependencies]
anyhow.workspace = true
share-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "io-util"] }
axum = { version = "0.8", features = ["ws"] }
libsql = { version = "0.10", default-features = false, features = ["core", "remote", "tls"] }
getrandom = "0.3"
argon2 = "0.5"
sha2 = "0.10"
base64 = "0.22"
subtle = "2"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false }
tokio-tungstenite = "0.29"
tempfile = "3"
